version: "3.8"

services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public
    networks:
      - appnet

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
    networks:
      - appnet

  db:
    ports:
      - "3306:3306"
    networks:
      - appnet

  vite:
    image: node:20
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - appnet

networks:
  appnet:

volumes:
  storage_data:
  public_data:
